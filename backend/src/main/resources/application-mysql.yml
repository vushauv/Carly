# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring:
  datasource:
    url: jdbc:mysql://${mysql.hostname:localhost}:3306/backend?createDatabaseIfNotExist=true&sslMode=PREFERRED&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true
    username: root
    password: dupa
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      driver-class-name: com.mysql.cj.jdbc.Driver
      connection-timeout: 50000
      maximum-pool-size: 10
      minimum-idle: 10
      pool-name: db-conn-pool
      connection-test-query: select 1 from dual
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  sql:
    init:
      mode: always
      continue-on-error: true
      platform: mysql
      # if you want ot upload test data create data.sql. if below is uncommented then data.sql will be executed
      schema-locations: classpath:/sql/schema-${spring.sql.init.platform}.sql
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
          time_zone: UTC
    show-sql: false
    generate-ddl: true
    # Hibernate ddl auto (create, create-drop, validate, update)
    hibernate:
      ddl-auto: update

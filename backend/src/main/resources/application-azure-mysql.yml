# Listen on the port passed through `PORT` environment variable (Fallback to 8080)
#server.port= ${PORT:8080}
server:
  port: 5000

spring:
  datasource:
    url: jdbc:mysql://${mysql.hostname}:${mysql.port}/${mysql.db.name}?sslMode=REQUIRED&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true
    username: ${mysql.username}
    password: ${mysql.password}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      driver-class-name: com.mysql.cj.jdbc.Driver
      connection-timeout: 50000
      max-lifetime: 900000
      maximum-pool-size: 10
      minimum-idle: 10
      pool-name: db-conn-pool
      connection-test-query: select 1 from dual
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false

  sql:
    init:
      mode: always
      continue-on-error: true
      platform: mysql
      # if you want ot upload test data create data.sql. if below is uncommented then data.sql will be executed
      schema-locations: classpath:/sql/schema-${spring.sql.init.platform}.sql
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
          time_zone: UTC
    show-sql: false
    generate-ddl: true
    # Hibernate ddl auto (create, create-drop, validate, update)
    hibernate:
      ddl-auto: none

# Actuator
# http://localhost:8080/actuator/env/spring.profiles.active
management:
  endpoints:
    web:
      exposure:
        include: health,env

# CORS
cors:
  urls: ${cors:*}